# Apple Silicon Mac（Colima + LaunchDaemon 自動起動）向けの運用 compose。
# v3.0.2 の公式 compose を基準に、Mac 向けに以下を変更している:
#   - `runtime: nvidia` と NVIDIA_* 環境変数を削除
#   - hwaccel.transcoding.yml (nvenc) / hwaccel.ml.yml (cuda) の extends を削除 -> CPU実行
#   - ftpd_server サービスを削除
#   - /etc/localtime マウントを削除 (macOS側の /etc/localtime はVM内で無意味)
# 実行時は /opt/immich/run/ 配下にこのファイルと .env を置き、そのディレクトリで
# `docker compose up -d` を実行する (MIGRATION.md 手順)。
#
# Media storage location は .env の UPLOAD_LOCATION（/Volumes/database4t/immich）、
# DB location は .env の DB_DATA_LOCATION（/opt/immich/postgres）で指定する。

name: immich

services:
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    volumes:
      # Do not edit the next line. If you want to change the media storage location on your system, edit the value of UPLOAD_LOCATION in the .env file
      - ${UPLOAD_LOCATION}:/data
    env_file:
      - .env
    ports:
      - '930:2283'
    depends_on:
      - redis
      - database
    restart: always
    healthcheck:
      disable: false

  immich-machine-learning:
    container_name: immich_machine_learning
    # Apple Silicon ではGPUアクセラレーションなし (CPU)。-cuda 等の拡張タグは付けない。
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}
    volumes:
      - model-cache:/cache
    env_file:
      - .env
    restart: always
    healthcheck:
      disable: false

  redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:9@sha256:fb8d272e529ea567b9bf1302245796f21a2672b8368ca3fcb938ac334e613c8f
    healthcheck:
      test: redis-cli ping || exit 1
    restart: always

  database:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
      # Uncomment the DB_STORAGE_TYPE: 'HDD' var if your database isn't stored on SSDs
      # DB_STORAGE_TYPE: 'HDD'
    volumes:
      # Do not edit the next line. If you want to change the database storage location on your system, edit the value of DB_DATA_LOCATION in the .env file
      - ${DB_DATA_LOCATION}:/var/lib/postgresql/data
    shm_size: 128mb
    restart: always

volumes:
  model-cache:
